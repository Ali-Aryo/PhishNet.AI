<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Mode - PhishNet.AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css"> 
</head>
<body>
    <div class="main-container">
        <header class="app-header">
            <img src="images/phishnet.png" alt="PhishNet.AI Logo" class="app-logo">
            <h1>Learning Mode</h1>
        </header>

        <div class="card learning-card">
            <a href="landing.html" class="back-button">&larr; Back to Home</a>
            
            <div class="progress-circles-container">
                <div class="progress-circle">
                    <div class="progress-circle-inner" id="userProgress">
                        <span id="userProgressText" class="progress-text">0%</span>
                    </div>
                    <p class="progress-label">Your Score</p>
                </div>
                <div class="progress-circle">
                    <div class="progress-circle-inner" id="modelProgress">
                        <span id="modelProgressText" class="progress-text">0%</span>
                    </div>
                    <p class="progress-label">Model's Score</p>
                </div>
            </div>

            <h2 class="challenge-title">Is this message Phishy?</h2>
            
            <div id="challengeContentArea" class="challenge-email-container">
                <p id="loadingMessage" class="loading-message">
                    <div class="spinner"></div>
                    Loading email...
                </p>
                <div id="challengeEmailContent" class="challenge-email-content hidden"></div>
                <p id="learningErrorMessage" class="error-message"></p>
            </div>

            <div class="user-guess-buttons hidden">
                <button id="guessPhishy" class="sleek-button guess-button guess-phishy">Phishy</button>
                <button id="guessNotPhishy" class="sleek-button guess-button guess-not-phishy">Not Phishy</button>
            </div>
            
            <p id="feedbackConfirmation" class="feedback-confirmation hidden"></p>

            <div id="learningResultSection" class="learning-result-section hidden">
                <div class="prediction-display">
                    <p>Your Guess: <span id="userGuessDisplay" class="result-label"></span></p>
                    <p>Model Prediction: <span id="modelPredictionDisplay" class="result-label"></span> (<span id="modelProbabilityText"></span>)</p> 
                </div>
                <div class="correct-answer">
                    <p>Correct Answer: <span id="trueLabelDisplay" class="result-label"></span></p>
                    <p class="explanation-text" id="explanationText"></p>
                </div>
                <button id="nextEmailButton" class="sleek-button next-button">Next Email &rarr;</button>
            </div>
            <p id="learningErrorMessage" class="error-message"></p>
        </div>
    </div>

    <script src="learn.js"></script> 
</body>
</html>
